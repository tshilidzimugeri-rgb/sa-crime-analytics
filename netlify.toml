[build]
  base = "frontend"
  command = "npm run build"
  # Relative to `base`, not repo root -- "frontend/dist" here would resolve
  # to frontend/frontend/dist and fail with "Deploy directory does not exist"
  # (confirmed against an actual failed Netlify build).
  publish = "dist"

# React Router uses client-side routing (BrowserRouter) -- any path that
# isn't a real static file must fall back to index.html so deep links like
# /province/GP work on a hard refresh instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
