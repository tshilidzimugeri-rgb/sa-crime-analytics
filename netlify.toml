[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

# React Router uses client-side routing (BrowserRouter) -- any path that
# isn't a real static file must fall back to index.html so deep links like
# /province/GP work on a hard refresh instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
